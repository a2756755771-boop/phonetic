<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>48 个国际音标学习</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.cx{max-width:860px;margin:0 auto;padding:20px 16px}
.nav{display:flex;gap:8px;margin-bottom:22px;border-bottom:1px solid #1e293b;padding-bottom:10px;flex-wrap:wrap}
.nb{padding:8px 14px;border:none;border-radius:8px;background:transparent;color:#94a3b8;font-size:14px;cursor:pointer;transition:all .2s}
.nb.ac{color:#e2e8f0;background:#1e293b}
.page{display:none}.page.ac{display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.sc{background:#1e293b;border-radius:12px;padding:16px 12px;text-align:center;border:1px solid #334155}
.sc .num{font-size:30px;font-weight:700}.sc .lbl{font-size:11px;color:#64748b;margin-top:2px}
.sc.g .num{color:#22c55e}.sc.y .num{color:#eab308}.sc.w .num{color:#64748b}
.card2{background:#1e293b;border-radius:12px;padding:16px;border:1px solid #334155;margin-bottom:16px;font-size:13px;color:#94a3b8;line-height:1.7}
.card2 b,.card2 strong{color:#c4b5fd}
.cat{margin-bottom:20px}.cat h3{font-size:15px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.cat h3 .cb{font-size:10px;padding:1px 8px;border-radius:8px;font-weight:400;background:#312e81;color:#a5b4fc}
.cat h3 .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-bottom:4px}
.pc{background:#1e293b;border-radius:8px;padding:8px 4px;text-align:center;border:2px solid #334155;font-family:'Times New Roman',Georgia,serif;font-size:18px;font-weight:700;transition:all .15s}
.pc.g{border-color:#22c55e;background:#052e16;color:#4ade80}
.pc.y{border-color:#eab308;background:#422006;color:#facc15}
.pc.w{color:#475569}.pc .sl{display:block;font-family:-apple-system,sans-serif;font-size:9px;font-weight:400;color:#64748b;margin-top:1px}
.tl{margin-bottom:20px}
.ti{display:flex;gap:12px;padding:8px 0;align-items:flex-start;border-left:2px solid #1e293b;margin-left:6px;padding-left:14px;position:relative}
.ti.done{border-color:#22c55e}.ti.cur{border-color:#6366f1}
.ti .td{width:8px;height:8px;border-radius:50%;background:#334155;position:absolute;left:-5px;top:12px}
.ti.done .td{background:#22c55e}.ti.cur .td{background:#6366f1}
.ti .day{font-size:12px;color:#94a3b8;min-width:60px;padding-top:1px}
.ti .tc{font-size:12px}.ti .ttl{font-weight:600;color:#e2e8f0}.ti .tdt{color:#64748b;font-size:11px;margin-top:1px}
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.hdr h1{font-size:20px;font-weight:700}
.bdg{background:#1e293b;padding:5px 12px;border-radius:16px;font-size:12px;color:#94a3b8}
.pbar{background:#1e293b;border-radius:8px;height:6px;margin-bottom:16px;overflow:hidden}
.pbf{height:100%;background:linear-gradient(90deg,#6366f1,#8b5cf6);border-radius:8px;transition:width .4s}
.pl{display:flex;justify-content:space-between;font-size:12px;color:#94a3b8;margin-bottom:6px}
.dnav{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.dnb{padding:5px 10px;border-radius:7px;border:1px solid #334155;background:#1e293b;color:#94a3b8;font-size:11px;cursor:pointer;transition:all .15s}
.dnb.ac{background:#6366f1;border-color:#6366f1;color:#fff}
.dnb.done{border-color:#22c55e;color:#22c55e}
.tabs{display:flex;margin-bottom:16px;background:#1e293b;border-radius:10px;padding:3px}
.tb{flex:1;padding:9px;border:none;border-radius:8px;background:transparent;color:#94a3b8;font-size:13px;cursor:pointer;transition:all .15s}
.tb.ac{background:#334155;color:#fff}
.cgrid{display:grid;grid-template-columns:1fr;gap:10px}
.card{background:#1e293b;border-radius:12px;padding:16px;border:1px solid #334155;transition:all .15s}
.card:hover{border-color:#6366f1}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ps{font-size:32px;font-weight:700;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-family:'Times New Roman',Georgia,serif;min-width:55px}
.pbtn{background:#334155;border:none;color:#e2e8f0;width:32px;height:32px;border-radius:50%;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.pbtn:hover{background:#6366f1}.pbtn.pla{background:#22c55e;animation:p 1s infinite}
@keyframes p{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.ctip{font-size:12px;color:#94a3b8;line-height:1.5}
.ccb{font-size:11px;color:#64748b;margin-top:4px}
.cws{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cws span{background:#0f172a;padding:3px 8px;border-radius:5px;font-size:12px;color:#a5b4fc;cursor:pointer;transition:all .1s}
.cws span:hover{background:#312e81}
.cmst{font-size:10px;color:#64748b;margin-top:8px;padding-top:8px;border-top:1px solid #1e293b}
.ssec{margin-top:10px;padding-top:10px;border-top:1px solid #1e293b}
.slbl{font-size:11px;color:#64748b;margin-bottom:6px}
.sact{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sbtn{padding:6px 12px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;font-size:12px;cursor:pointer;transition:all .15s}
.sbtn:hover{border-color:#6366f1}
.sbtn.rec{background:#7f1d1d;border-color:#dc2626;color:#fca5a5;animation:rp .8s infinite}
@keyframes rp{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.3)}50%{box-shadow:0 0 0 6px rgba(220,38,38,0)}}
.sbtn.prec{background:#064e3b;border-color:#22c55e;color:#4ade80}
.sbtn:disabled{opacity:.35;cursor:not-allowed}
.rtm{font-size:11px;color:#fca5a5;font-variant-numeric:tabular-nums}
.sst{font-size:11px;color:#64748b;margin-top:6px}
.qarea{display:none}.qarea.show{display:block}
.qtl{font-size:15px;font-weight:600;margin-bottom:14px;text-align:center}
.qq{font-size:44px;font-weight:700;text-align:center;padding:28px;border-radius:14px;margin-bottom:16px;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-family:'Times New Roman',Georgia,serif}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qopts button{padding:12px;border-radius:10px;border:2px solid #334155;background:#1e293b;color:#e2e8f0;font-size:14px;cursor:pointer;transition:all .15s;text-align:left}
.qopts button:hover{border-color:#6366f1;background:#1e1b4b}
.qopts button.cr{border-color:#22c55e;background:#052e16}
.qopts button.wr{border-color:#ef4444;background:#450a0a}
.qfb{text-align:center;padding:14px;font-size:14px;display:none}.qfb.show{display:block}
.qsc{display:flex;justify-content:center;gap:20px;margin-bottom:14px}
.qsc div{text-align:center}.qsc .num{font-size:26px;font-weight:700}.qsc .lbl{font-size:10px;color:#64748b}
.qsc .cn{color:#22c55e}.qsc .wn{color:#ef4444}
.nbtn{width:100%;padding:12px;border-radius:10px;border:none;background:#6366f1;color:#fff;font-size:14px;cursor:pointer;font-weight:600;margin-top:14px;display:none}
.nbtn.show{display:block}
.rpt{background:#1e293b;border-radius:12px;padding:18px;border:1px solid #334155;font-size:13px;line-height:1.6;white-space:pre-wrap;font-family:monospace;max-height:400px;overflow-y:auto;margin-bottom:12px}
.cpbtn{padding:8px 16px;border-radius:8px;border:none;background:#6366f1;color:#fff;font-size:13px;cursor:pointer}
@media(max-width:500px){.qopts{grid-template-columns:1fr}.ps{font-size:26px}.card{padding:12px}.pg{grid-template-columns:repeat(auto-fill,minmax(50px,1fr))}.pc{font-size:14px;padding:6px 2px}.stats{grid-template-columns:repeat(3,1fr);gap:6px}.sc{padding:12px 8px}.sc .num{font-size:24px}}</style>
</head>
<body>
<div class="cx">
<div class="nav">
 <button class="nb ac">总览</button>
 <button class="nb">学习</button>
 <button class="nb">综合练习</button>
 <button class="nb">学习报告</button>
</div>

<div class="page ac" id="pg-overview">
 <div class="stats">
  <div class="sc g"><div class="num" id="o-m">0</div><div class="lbl">已掌握</div></div>
  <div class="sc y"><div class="num" id="o-l">0</div><div class="lbl">学习中</div></div>
  <div class="sc w"><div class="num" id="o-n">48</div><div class="lbl">待学习</div></div>
 </div>
 <div class="card2">一共 <strong>48 个英语国际音标</strong>：<strong>20 个元音</strong> + <strong>28 个辅音</strong>。按发音规律拆成 <strong>10 天</strong> 学完，每天 3~6 个音标，搭配已学单词做锚点。</div>
 <div id="ov-cats"></div>
 <h3 style="font-size:15px;font-weight:700;margin-bottom:8px;color:#c4b5fd;">学习计划（10天）</h3>
 <div class="tl" id="ov-tl"></div>
</div>

<div class="page" id="pg-learn">
 <div class="hdr"><h1>音标学习</h1><span class="bdg" id="l-bdg">第 1 天 / 共 10 天</span></div>
 <div class="pl"><span>学习进度</span><span id="l-pl">第 1 天：长元音</span></div>
 <div class="pbar"><div class="pbf" id="l-pbf" style="width:10%"></div></div>
 <div class="dnav" id="l-dnav"></div>
 <div class="tabs" id="l-tabs">
  <button class="tb ac">学习音标</button>
  <button class="tb">每日练习</button>
 </div>
 <div id="l-cards" class="cgrid"></div>
 <div id="l-quiz" class="qarea">
  <div class="qsc">
   <div><div class="num cn" id="lqc">0</div><div class="lbl">正确</div></div>
   <div><div class="num" style="color:#94a3b8" id="lqt">0</div><div class="lbl">已答</div></div>
   <div><div class="num wn" id="lqw">0</div><div class="lbl">错误</div></div>
  </div>
  <div class="qq" id="lqq">/ɑː/</div>
  <div class="qtl" id="lqi"></div>
  <div class="qopts" id="lqo"></div>
  <div class="qfb" id="lqf"></div>
  <button class="nbtn" id="lqn">下一题</button>
 </div>
</div>

<div class="page" id="pg-practice">
 <div style="margin-bottom:14px"><h1 style="font-size:20px;">综合练习</h1><p style="font-size:12px;color:#64748b;margin-top:2px">随机从 48 个音标和锚点词中出题</p></div>
 <div class="qarea show">
  <div class="qsc">
   <div><div class="num cn" id="pqc">0</div><div class="lbl">正确</div></div>
   <div><div class="num" style="color:#94a3b8" id="pqt">0</div><div class="lbl">已答</div></div>
   <div><div class="num wn" id="pqw">0</div><div class="lbl">错误</div></div>
  </div>
  <div class="qq" id="pqq">/ɑː/</div>
  <div class="qtl" id="pqi"></div>
  <div class="qopts" id="pqo"></div>
  <div class="qfb" id="pqf"></div>
  <button class="nbtn" id="pqn">下一题</button>
 </div>
</div>

<div class="page" id="pg-report">
 <h2 style="font-size:18px;margin-bottom:14px;">学习报告</h2>
 <div id="rpt-content" class="rpt">暂无学习记录</div>
 <button class="cpbtn" onclick="copyReport()">复制报告</button>
 <span id="rpt-msg" style="font-size:12px;color:#22c55e;margin-left:10px;display:none">已复制！</span>
</div>

</div>
<script>

function tts(w, slow){ if(!window.speechSynthesis)return; window.speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(w); u.lang='en-US'; u.rate=slow?0.35:0.85; window.speechSynthesis.speak(u); }

function speakPhonetic(text){
  // Play the anchor word slowly - this is how phonetics is taught:
  // hearing the sound in a real word context
  tts(text, true);
}

function ttsM(btn,ws){ if(!window.speechSynthesis)return; window.speechSynthesis.cancel(); btn.classList.add('pla'); ws.forEach(function(w,i){ var u=new SpeechSynthesisUtterance(w); u.lang='en-US';u.rate=0.85; if(i===ws.length-1)u.onend=function(){btn.classList.remove('pla');}; window.speechSynthesis.speak(u); }); }

var REC={};
var RST={};

function startRec(id,word){
 var se=document.getElementById('ss-'+id);
 var te=document.getElementById('rt-'+id);
 var rb=document.querySelector('#sact-'+id+' .sbtn');
 var pb=document.getElementById('pb-'+id);
 se.innerHTML='<span style="color:#eab308">播放标准发音...</span>';
 pb.disabled=true; window.speechSynthesis.cancel();
 var u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=0.8;
 u.onend=function(){
  se.innerHTML='<span style="color:#fca5a5">请大声跟读！</span>';
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
   var cks=[];
   var mimeType='audio/webm';
   if(!MediaRecorder.isTypeSupported(mimeType)){ mimeType='audio/mp4'; }
   if(!MediaRecorder.isTypeSupported(mimeType)){ mimeType='audio/aac'; }
   if(!MediaRecorder.isTypeSupported(mimeType)){ mimeType=''; }
   var rc=new MediaRecorder(st, mimeType?{mimeType:mimeType}:{});
   rc.ondataavailable=function(e){cks.push(e.data);};
   rc.onstop=function(){
    var bl=new Blob(cks,{type:mimeType||'audio/mp4'}); REC[id]=bl;
    pb.disabled=false;pb.classList.add('prec');
    if(rb){rb.classList.remove('rec');rb.textContent='再试一次';}
    if(te)te.style.display='none';
    if(RST[id])clearInterval(RST[id].t);
    se.innerHTML='<span style="color:#4ade80">完成！点播放对比听听</span>';
    st.getTracks().forEach(function(t){t.stop();}); delete RST[id];
   };
   rc.start(); RST[id]={recorder:rc,stream:st};
   if(rb)rb.classList.add('rec'); if(te)te.style.display='';
   var s=0; var t=setInterval(function(){s++;if(te)te.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');RST[id].t=t;if(s>=10)RST[id].recorder.stop();},1000);
  }).catch(function(){ se.innerHTML='<span style="color:#ef4444">录音失败，请允许麦克风权限</span>'; });
 };
 window.speechSynthesis.speak(u);
}

function playRec(id){ var b=REC[id]; if(!b)return; var u=URL.createObjectURL(b); var a=new Audio(u);a.play();a.onended=function(){URL.revokeObjectURL(u);}; }

function loadProg(){ try{ return JSON.parse(localStorage.getItem('phonetic_progress')||'{}'); }catch(e){ return {}; } }
function saveProg(pr){ localStorage.setItem('phonetic_progress',JSON.stringify(pr)); }
var progress=loadProg();

function getLvl(sym){
 var p=progress[sym];
 if(!p||!p.correct)return 'none';
 var r=p.correct/(p.total||1);
 if(r>=0.8 && p.correct>=3)return 'mastered';
 if(p.correct>0)return 'learning';
 return 'none';
}

function getDayStatus(dayIdx){
 var day=PLAN[dayIdx];
 var allSyms=day.sym;
 var levels=allSyms.map(function(s){return getLvl(s);});
 var mastered=levels.filter(function(l){return l==='mastered';}).length;
 if(mastered===allSyms.length)return 'done';
 if(levels.some(function(l){return l!=='none';}))return 'started';
 return 'none';
}

function getOverall(){
 var m=0,l=0,n=0;
 P.forEach(function(p){ var lv=getLvl(p.s); if(lv==='mastered')m++; else if(lv==='learning')l++; else n++; });
 return {mastered:m,learning:l,none:n};
}

 });

var dqIdx=0,dqCorrect=0,dqWrong=0,dqAnswered=false,dqData=[];

function genDailyQuiz(){
 var d=PLAN[curDay];
 var qs=[];
 d.sym.forEach(function(s){
  var p=PM[s]; if(!p)return;
  var ws=getAnchorWords(s);
  if(ws.length===0)return;
  var correctWord=ws[Math.floor(Math.random()*ws.length)];
  var wrongWords=[];
  var otherSyms=P.filter(function(pp){return pp.s!==s;});
  for(var k=0;k<otherSyms.length && wrongWords.length<3;k++){
   var ow=getAnchorWords(otherSyms[k].s);
   if(ow.length>0 && wrongWords.indexOf(ow[0])===-1) wrongWords.push(ow[0]);
  }
  while(wrongWords.length<3)wrongWords.push('word'+wrongWords.length);
  var opts1=[correctWord].concat(wrongWords.slice(0,3)).sort(function(){return Math.random()-0.5;});
  qs.push({q:s,ans:correctWord,opts:opts1,inst:'这个音标对应哪个单词？',type:'s2w'});
  var wrongSyms=[];
  for(k=0;k<otherSyms.length&&wrongSyms.length<3;k++)wrongSyms.push(otherSyms[k].s);
  var opts2=[s].concat(wrongSyms.slice(0,3)).sort(function(){return Math.random()-0.5;});
  qs.push({q:correctWord,ans:s,opts:opts2,inst:'这个单词的音标是？',type:'w2s'});
 });
 return qs.sort(function(){return Math.random()-0.5;});
}

function startDailyQuiz(){ dqIdx=0;dqCorrect=0;dqWrong=0;dqData=genDailyQuiz(); updateDQScore(); dqLoad(); }

function updateDQScore(){ document.getElementById('lqc').textContent=dqCorrect;document.getElementById('lqt').textContent=dqCorrect+dqWrong;document.getElementById('lqw').textContent=dqWrong; }

function dqLoad(){
 if(dqIdx>=dqData.length){
  document.getElementById('lqq').textContent='done';document.getElementById('lqi').textContent='练习完成！正确 '+dqCorrect+'/'+dqData.length+' ('+Math.round(dqCorrect/Math.max(dqData.length,1)*100)+'%)';
  document.getElementById('lqo').innerHTML='';document.getElementById('lqf').classList.remove('show');document.getElementById('lqn').classList.remove('show');
  return;
 }
 dqAnswered=false;
 var q=dqData[dqIdx];
 document.getElementById('lqq').textContent=q.q;document.getElementById('lqi').textContent=q.inst;
 document.getElementById('lqf').classList.remove('show');document.getElementById('lqn').classList.remove('show');
 document.getElementById('lqo').innerHTML=q.opts.map(function(o){return'<button>'+o+'</button>';}).join('');
 document.querySelectorAll('#lqo button').forEach(function(b,i){b.addEventListener('click',function(){dqAnswer(this,this.textContent);});});
}

function dqAnswer(btn,chosen){
 if(dqAnswered)return; dqAnswered=true;
 var q=dqData[dqIdx];
 var ok=chosen===q.ans;
 var sym=q.type==='s2w'?q.q:q.ans;
 if(ok){dqCorrect++;btn.classList.add('cr');}
 else{dqWrong++;btn.classList.add('wr');document.querySelectorAll('#lqo button').forEach(function(b){if(b.textContent===q.ans)b.classList.add('cr');});}
 var fb=document.getElementById('lqf');fb.classList.add('show');
 fb.innerHTML=ok?'<span style="color:#22c55e">正确！</span>':'<span style="color:#ef4444">正确答案是 <strong>'+q.ans+'</strong></span>';
 document.getElementById('lqn').classList.add('show');
 updateDQScore();
 var pr=loadProg();
 if(!pr[sym])pr[sym]={correct:0,total:0,streak:0};
 pr[sym].total=(pr[sym].total||0)+1;
 if(ok){pr[sym].correct=(pr[sym].correct||0)+1;pr[sym].streak=(pr[sym].streak||0)+1;}
 else{pr[sym].streak=0;}
 saveProg(pr);
}
document.getElementById('lqn').addEventListener('click',function(){dqIdx++;dqLoad();});

var pqIdx=0,pqCorrect=0,pqWrong=0,pqAnswered=false,pqData=[];

function genPQ(){
 var qs=[];
 P.forEach(function(p){
  var ws=p.w;
  if(ws.length===0)return;
  var cw=ws[Math.floor(Math.random()*ws.length)];
  var ww=[]; var ops=P.filter(function(pp){return pp.s!==p.s && pp.w.length>0;});
  for(var k=0;k<ops.length&&ww.length<3;k++){ var ow=ops[k].w; if(ow.length>0 && ww.indexOf(ow[0])===-1)ww.push(ow[0]); }
  while(ww.length<3)ww.push('x'+ww.length);
  var o1=[cw].concat(ww.slice(0,3)).sort(function(){return Math.random()-0.5;});
  qs.push({q:p.s,ans:cw,opts:o1,inst:'这个音标对应哪个单词？',s:p.s});
  var wsyms=[];
  for(k=0;k<ops.length&&wsyms.length<3;k++)wsyms.push(ops[k].s);
  var o2=[p.s].concat(wsyms.slice(0,3)).sort(function(){return Math.random()-0.5;});
  qs.push({q:cw,ans:p.s,opts:o2,inst:'这个单词的音标是？',s:p.s});
 });
 return qs.sort(function(){return Math.random()-0.5;});
}

function startPQ(){ pqIdx=0;pqCorrect=0;pqWrong=0;pqData=genPQ(); updatePQScore(); pqLoad(); }

function pqAnswer(btn,chosen){

function genReport(){
 var pr=loadProg();
 var o=getOverall();
 var totalQ=0,totalC=0;
 Object.values(pr).forEach(function(p){totalQ+=p.total||0;totalC+=p.correct||0;});
 var accuracy=totalQ>0?Math.round(totalC/totalQ*100):0;
 var r='48个国际音标学习报告\n';
 r+='===========================\n\n';
 r+='总览\n';
 r+='  已掌握：'+o.mastered+'/'+48+' ('+Math.round(o.mastered/48*100)+'%)\n';
 r+='  学习中：'+o.learning+'/'+48+'\n';
 r+='  待学习：'+o.none+'/'+48+'\n';
 r+='  总答题：'+totalQ+' | 正确率：'+accuracy+'%\n\n';
 r+='每日进度\n';
 PLAN.forEach(function(d,i){
  var syms=d.sym;
  var mc=syms.filter(function(s){return getLvl(s)==='mastered';}).length;
  var ic=getDayStatus(i)==='done'?'[OK]':'[  ]';
  r+=ic+' 第'+d.d+'天 '+d.title+': '+mc+'/'+syms.length+' 掌握\n';
 });
 r+='\n各音标详情\n';
 P.forEach(function(p){
  var lv=getLvl(p.s);
  var pd=pr[p.s]||{};
  var icon=lv==='mastered'?'[OK]':lv==='learning'?'[..]':'[  ]';
  r+=icon+' '+p.s;
  if(pd.total)r+=' | 答题'+pd.total+' 正确率'+(pd.total>0?Math.round((pd.correct||0)/pd.total*100):0)+'%';
  r+='\n';
 });
 r+='\n===========================\n';
 r+='生成时间：'+new Date().toLocaleDateString('zh-CN');
 document.getElementById('rpt-content').textContent=r;
}

function copyReport(){
 genReport();
 var r=document.getElementById('rpt-content').textContent;
 navigator.clipboard.writeText(r).then(function(){
  document.getElementById('rpt-msg').style.display='inline';
  setTimeout(function(){document.getElementById('rpt-msg').style.display='none';},2000);
 }).catch(function(){ alert('复制失败，请手动复制'); });
}
